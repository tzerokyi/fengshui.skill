name: rust-native

on:
  push:
    branches:
      - 'feat/native-rust-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanyu-rust-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  core:
    # Never run arbitrary fork PR code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    env:
      CARGO_BUILD_JOBS: '12'
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain preflight
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Persistent Cargo target cache
        run: echo "CARGO_TARGET_DIR=${{ runner.tool_cache }}/kanyu-native-target" >> "$GITHUB_ENV"
      - name: rustfmt preview (format-only source commit)
        if: contains(github.event.head_commit.message, '[format]')
        run: |
          cargo fmt --all
          git diff -- src/
          git diff --quiet -- src/ || { echo 'Apply exact rustfmt diff to staged sources and rerun'; exit 1; }
      - name: Verify formatting
        if: "!contains(github.event.head_commit.message, '[format]')"
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: "!contains(github.event.head_commit.message, '[format]')"
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test public core and CLI
        if: "!contains(github.event.head_commit.message, '[format]')"
        run: cargo test --locked --all-targets
      - name: Build linked native CLI
        if: "!contains(github.event.head_commit.message, '[format]')"
        run: cargo build --locked --release --bin kanyu
      - name: Exercise headless JSON contract
        if: "!contains(github.event.head_commit.message, '[format]')"
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          cli = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / "kanyu"
          def call(*args):
              result = subprocess.run([str(cli), *args, "--json"],
                                      capture_output=True, text=True, check=True)
              assert result.stderr == "", result.stderr
              return json.loads(result.stdout)

          assert call("doctor")["runtime"] == "native-rust"
          assert call("mingua", "--year", "1990", "--gender", "f")["person"]["number"] == 8
          chart = call("feixing", "--sit", "子", "--yun", "8")
          assert chart["main_pattern"] == "双星到向"
          assert chart["shan"]["巽"] == 3
          assert call("liunian", "--year", "2026")["years"][0]["wuhuang"] == "南"
          bad = subprocess.run([str(cli), "feixing", "--sit", "子", "--yun", "0", "--json"],
                               capture_output=True, text=True)
          assert bad.returncode == 2 and not bad.stdout and bad.stderr
          print("native CLI smoke: ok")
          PY
